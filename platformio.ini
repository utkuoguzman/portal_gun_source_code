[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
board_build.partitions = default_16MB.csv
board_upload.flash_size = 16MB
build_flags = -D WOKWI_SIM
extra_scripts = post:tools/merge_bin.py
lib_deps =
    adafruit/Adafruit NeoPixel @ ^1.11.0
    smougenot/TM1637

[env:arduino_nano_esp32]
platform = espressif32
board = arduino_nano_esp32
framework = arduino
upload_protocol = esptool
monitor_port = COM3
monitor_speed = 115200
board_build.partitions = partitions_portal.csv
build_flags = -D NAKED_TEST_MODE
build_src_filter = +<*> -<modules/audio_assets.cpp> -<modules/extra_audio.cpp> -<modules/soundboard_data.cpp>
lib_deps =
    adafruit/Adafruit NeoPixel @ ^1.11.0
    smougenot/TM1637


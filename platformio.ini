[platformio]
default_envs = esp32dev

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
board_build.partitions = partitions_portal.csv
board_upload.flash_size = 16MB
lib_deps =
    adafruit/Adafruit NeoPixel @ ^1.11.0
    smougenot/TM1637

[env:esp32dev_ota]
platform = espressif32
board = esp32dev
framework = arduino
upload_protocol = espota
upload_port = 192.168.4.1
upload_flags =
    --port=3232
board_build.partitions = partitions_portal.csv
lib_deps =
    adafruit/Adafruit NeoPixel @ ^1.11.0
    smougenot/TM1637

[env:arduino_nano_esp32]
platform = espressif32
board = arduino_nano_esp32
framework = arduino
upload_protocol = esptool
monitor_speed = 115200
board_build.partitions = partitions_portal.csv
build_flags = 
    -DBOARD_USES_HW_GPIO_NUMBERS
lib_deps =
    adafruit/Adafruit NeoPixel @ ^1.11.0
    smougenot/TM1637

[env:arduino_nano_esp32_ota]
platform = espressif32
board = arduino_nano_esp32
framework = arduino
upload_protocol = espota
upload_port = 192.168.4.1
upload_flags =
    --port=3232
board_build.partitions = partitions_portal.csv
build_flags = 
    -DBOARD_USES_HW_GPIO_NUMBERS
lib_deps =
    adafruit/Adafruit NeoPixel @ ^1.11.0
    smougenot/TM1637
